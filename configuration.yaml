api:
  host: "0.0.0.0"
  port: 10006
  debug: true

pipeline:
  batch_time_budget: 14400
  prompt_timeout: 600.0
  use_planner: false
  render_from_object: true
  refinement_enabled: false
  seed_offset: 1000003
  # Warm-up coder throughput probe: 48 text-only code requests x 512 tokens, aggregate output tok/s.
  # min_tps 0 = measure and log only. CALIBRATE before enabling: run one healthy 4xH200 pod, read
  # "[Coder probe] ... tok/s" from pipeline.log, set min_tps to ~0.8x that value.
  coder_probe:
    enabled: true
    concurrency: 48
    max_tokens: 512
    min_tps: 0

preflight:
  min_tflops: 30
  min_stream48_gbps: 0
  min_power_limit_w: 0

benchmark: true
warmup: true

llm_clients:
  openrouter:
    enabled: false
    base_url: "https://openrouter.ai/api/v1"
    api_key_env: "OPENROUTER_API_KEY"
  coder-instance:
    enabled: true
    base_url: "http://localhost:8001/v1"
    api_key: "local"
    vllm:
      model: "magicworld7/qwen36-27b-it0-fp8"
      revision: "45e8433923d9c62af45462e2f4d7083b89c3931b"
      gpu_ids: "0,1"
      tensor_parallel_size: 1
      data_parallel_size: 2
      vllm_bin: "/opt/vllm-coder-env/bin/vllm"
      gpu_memory_utilization: 0.9
      max_model_len: 81920
      max_num_seqs: 256
      extra_args:
        - "--speculative-config"
        - '{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","revision":"0919688658996800f86b895034249700e9481106","num_speculative_tokens":7}'
  judge-critic-instance:
    enabled: true
    base_url: "http://localhost:8002/v1"
    api_key: "local"
    vllm:
      model: "zai-org/GLM-4.6V-Flash"
      revision: "411bb4d77144a3f03accbf4b780f5acb8b7cde4e" 
      gpu_ids: "2,3"
      tensor_parallel_size: 1
      data_parallel_size: 2
      gpu_memory_utilization: 0.5
      max_model_len: 81920
      max_num_seqs: 196
      extra_args: ["--max-num-batched-tokens", "16384"]
      vllm_bin: "/opt/vllm-glm-env/bin/vllm"
      trust_remote_code: true
      reasoning_parser: null

embedder:
  model_id: "Fluxmire/dinov3-vits16-pretrain-lvd1689m"
  revision: "1b5ff8f92bb8e8c36de80bf4c49035c105f070ee"

actors:
  planner:
    client: "coder-instance"
    model: "magicworld7/qwen36-27b-it0-fp8"
    workers: 256
    queue_size: 128
    max_tokens: 32768
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.08
    seed: 42
    reasoning_effort: "medium"
    enable_thinking: false
    providers:
      order: []
      allow_fallbacks: true
  coder:
    client: "coder-instance"
    model: "magicworld7/qwen36-27b-it0-fp8"
    workers: 256
    queue_size: 128
    max_tokens: 24576
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.08
    seed: 42
    enable_thinking: false
    multimodal: true
    ensemble_size: 48
    ensemble_temperature: 0.6
    providers:
      order: []
      allow_fallbacks: true
  patcher:
    workers: 64
    queue_size: 64
  critic:
    client: "judge-critic-instance"
    model: "zai-org/GLM-4.6V-Flash"
    workers: 128
    queue_size: 64
    max_tokens: 6144
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    presence_penalty: 0.0
    repetition_penalty: 1.08
    seed: 42
    reasoning_effort: "medium"
    enable_thinking: false
    ensemble_size: 1
    providers:
      order: []
      allow_fallbacks: true
  judge:
    client: "judge-critic-instance"
    model: "zai-org/GLM-4.6V-Flash"
    workers: 128
    queue_size: 64
    max_tokens: 8192
    temperature: 0.0
    seed: 42
    providers:
      order: []
      allow_fallbacks: true
  checker:
    workers: 32
    queue_size: 32
  renderer:
    workers: 16
    queue_size: 32

event_bus:
  max_iter: 2
  task_deadline_s: 3600
  score_threshold: 0.55

js_checker:
  execution_timeout_ms: 5000
  node_binary: "node"

renderer:
  sidecar_host: "127.0.0.1"
  sidecar_port: 8003
  startup_timeout_s: 60.0
  request_timeout_s: 90.0
  node_binary: "node"
  img_size: 1024
  grid_gap: 5
  bg_color: null
  lighting: neutral
  sidecar_count: 8
  pool_size: 2
  render_timeout_ms: 60000
  protocol_timeout_ms: 60000
